<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0813;--pn:#150f24;--ln:#3a2b5c;--tx:#efe9fb;--mu:#a99cc7;--gold:#e0b04a;--cy:#b99cff;--bad:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 "Source Sans 3",system-ui,sans-serif}
h1,h2{font-family:Rajdhani,system-ui,sans-serif;margin:0}
h1{font-size:2rem;color:var(--gold);letter-spacing:.02em}
h2{font-size:1.25rem;margin-bottom:.6rem}
header{padding:1.2rem 1rem .4rem;max-width:1300px;margin:auto}
header p{margin:.2rem 0 0;color:var(--mu)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem;padding:1rem;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:1rem}
#saved{grid-column:1/-1}
button,select,input{font:inherit;color:var(--tx);background:#0b0813;border:1px solid var(--ln);border-radius:6px;padding:.45rem .7rem}
button{cursor:pointer}button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:600}
button.on{border-color:var(--gold);color:var(--gold)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.7rem;align-items:center}
.row>select,.row>input[type=text],.row>input[type=search]{flex:1;min-width:140px}
.bar{height:10px;background:#0b0813;border-radius:3px;overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;background:var(--cy)}.bar.over i{background:var(--bad)}
.capt{display:flex;justify-content:space-between;margin:.8rem 0 .3rem;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.8rem 0}
@media(max-width:560px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot select{padding:.1rem .2rem;font-size:.8rem;width:100%}
.slot{min-height:128px;border:1px dashed var(--ln);border-radius:8px;padding:.4rem;font-size:.85rem;display:flex;flex-direction:column;gap:.25rem;position:relative}
.slot.f{border-style:solid;border-color:#5a4690;background:#241a3d}
.slot.aura{border-color:var(--gold)}
.slot b{font-weight:600;line-height:1.2}
.slot img,.card img{width:38px;height:38px;object-fit:contain;float:left;margin-right:.4rem}
.slot .x{position:absolute;right:2px;top:2px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid #5a4690;border-radius:50%;background:#0b0813ee;color:#f2cf74;font:700 1.15rem/1 Rajdhani,sans-serif;cursor:pointer;z-index:2}
.slot .x:hover{border-color:var(--gold);color:#fff;background:#2d1b55}
.slot input{width:3.6rem;padding:.15rem .3rem}
.pol{color:var(--cy);font-size:.78rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.5rem;max-height:70vh;overflow:auto}
.card{text-align:left;border-radius:6px;padding:.45rem;font-size:.85rem;min-height:62px}
.card small{display:block;color:var(--mu)}
.arcs{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.aslot{min-height:64px;border:1px dashed var(--ln);border-radius:8px;padding:.4rem;font-size:.85rem;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.2rem}
.aslot.f{border:1px solid var(--gold)}
.aslot img{width:34px;height:34px;float:none;margin:0}
.aslot b,.aslot span{display:block;width:100%;text-align:center}
.aslot .x{position:absolute;right:2px;top:2px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid #5a4690;border-radius:50%;background:#0b0813ee;color:#f2cf74;font:700 1.15rem/1 Rajdhani,sans-serif;cursor:pointer;z-index:2}
.aslot .x:hover{border-color:var(--gold);color:#fff;background:#2d1b55}
.slot.sp,.sp3 .slot{border-color:var(--gold)}.sp3{grid-template-columns:repeat(3,1fr);margin-bottom:0}
.pb{align-self:flex-start;padding:.05rem .4rem;font-size:.75rem;color:var(--cy)}
.card,.slot,.aslot{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dragging{opacity:.4}.over{outline:2px solid var(--gold)}
.ghost{position:fixed!important;z-index:99;pointer-events:none;opacity:.92;margin:0;box-shadow:0 6px 18px #0008}
.bl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--ln)}
.bl span{flex:1;min-width:160px}
.muted{color:var(--mu)}#msg{padding:.4rem 0;color:var(--gold)}
textarea{width:100%;font:inherit;color:var(--tx);background:#0b0813;border:1px solid var(--ln);border-radius:6px;padding:.5rem;resize:vertical}
.gal{display:flex;flex-wrap:wrap;gap:.5rem}.gal figure{margin:0;position:relative}
.gal img{max-width:200px;max-height:160px;border-radius:6px;cursor:zoom-in;border:1px solid var(--ln)}
.gal img.big{max-width:100%;max-height:none;cursor:zoom-out}.gal figure:has(img.big){flex-basis:100%}
.gal .x{position:absolute;right:4px;top:4px;background:#0b0813cc;border:1px solid var(--ln);border-radius:4px;padding:0 .4rem}
.ro #browser,.ro #cats,.ro #save,.ro #new,.ro #admrow,.ro #imgctl,.ro .x{display:none}
.ro main{grid-template-columns:1fr}.ro:not(.open) #builder{display:none}.ro .pb{pointer-events:none}
.ti{width:44px;height:44px;object-fit:contain}
.pb{color:var(--mu)}.pb.fm{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:600}
.cfgover{border-color:var(--bad)!important;box-shadow:0 0 0 2px var(--bad)}
.bwrap{display:flex;gap:.6rem}.bwrap>div:first-child{flex:1;min-width:0}
#abil:empty{display:none}#abil{display:flex;flex-direction:column;gap:.4rem;width:116px}
.ab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.3rem;font-size:.72rem;text-align:center;color:var(--mu)}
.ab img{width:44px;height:44px;object-fit:contain;filter:grayscale(1);opacity:.8}.ab.sw{border-color:var(--gold);color:var(--gold)}.ab.sw img{filter:none;opacity:1}.ab s{color:var(--mu)}
#omni.on{border-color:var(--gold);color:var(--gold)}
.notev{margin:.5rem 0;line-height:1.5}.notev a{color:var(--gold)}.ro #note{display:none}
.rivs{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.6rem}.riv{flex:1 1 200px;border:1px solid var(--gold);border-radius:8px;padding:.5rem;display:flex;flex-direction:column;gap:.35rem}
.dis{font-size:.78rem;color:var(--cy)}.rs{display:flex;justify-content:space-between;background:#241a3d;border-radius:4px;padding:.15rem .4rem;font-size:.85rem}
.rs.neg{color:var(--bad)}.rs.sp{border:1px solid var(--cy)}.rs button,.riv .x2{border:0;background:none;padding:0 .3rem;color:var(--mu)}
.ro .x2,.ro .rs button,.ro #addriv,.ro #omni{display:none}
.shards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.6rem}.shd{font-size:.85rem;color:var(--mu);margin-top:.25rem;line-height:1.35}
.ro #custrow{display:none}.shards select{width:100%}.shards>div{border-left:4px solid var(--ln);padding-left:.4rem}
.intgt #cats,.intgt #item,.intgt #elrow,.intgt #timg{display:none}
.evl{display:block;margin:.4rem 0;font-weight:600}.evl textarea{margin-top:.2rem;font-weight:400}
details summary{cursor:pointer;margin-top:1rem;font:700 1.25rem Rajdhani,sans-serif}
.slots.sp3{display:flex;justify-content:center;flex-wrap:wrap}.sp3 .slot{width:150px}.xh{margin:.6rem 0 .2rem;text-align:center;font-size:1rem}
.ro #elrow,.ro #reactor,.ro label:has(#reactor){display:none}
#back{display:none}.ro.open #back{display:inline-block;margin-bottom:.6rem}.ro.open #saved{display:none}
.shards{grid-template-columns:1fr!important}
.shards>div{padding:.6rem .8rem!important;background:#241a3d;border-radius:8px;min-height:96px}
.shd{font-size:1rem!important;line-height:1.5!important;margin-top:.4rem!important;color:var(--tx)!important}
.ro #reset{display:none}
.ro select,.ro input[type=text],.ro input[type=number]{appearance:none;-webkit-appearance:none;background-image:none;border-color:transparent;opacity:1;color:var(--tx)}
.ro select:disabled,.ro input:disabled{opacity:1;color:var(--tx)}
.ro .shards select,.ro .aslot:not(.f),.ro .shards>div:not(.sf){display:none}
.ro #name{font:700 1.2rem Rajdhani,sans-serif;padding-left:0}
.arcs{display:flex!important;justify-content:center;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}.aslot{width:150px;min-height:104px}
.ro #autof{display:none}
.ro .topbar{display:none}
html{font-size:17px}body{font-weight:500;line-height:1.4}
h1{font-size:2.3rem}h2{font-size:1.4rem}.panel{padding:.8rem}
button,select,input,textarea{font-size:1rem;font-weight:600}
.slot{font-size:1rem;padding:.4rem;min-height:92px;gap:.2rem}.slot b{font-size:1.05rem;font-weight:700}.slot .pol{font-size:.95rem;font-weight:600}
.slot img,.card img{width:44px;height:44px}.slot select.pb{font-size:.95rem;font-weight:700;padding:.2rem .4rem}
.card{font-size:1.02rem}.card b{font-weight:700}.card small{font-size:.92rem;font-weight:600}.muted{font-size:.95rem}
.notev,textarea{font-size:1.08rem;font-weight:600;line-height:1.5}.aslot{font-size:1rem;font-weight:600}
.shards>div{min-height:0!important;padding:.4rem .7rem!important}.shd{font-size:1.08rem!important;font-weight:600!important;line-height:1.4!important}
.bl{font-size:1.05rem}.bl b{font-weight:700;font-size:1.15rem}.ab{font-size:.85rem;font-weight:600}.rs{font-size:1rem;font-weight:600}.dis{font-size:.9rem}
.ro #admtop{display:none}
#cmbox{margin-bottom:.8rem}.ro #cmbox{display:none}
*{scrollbar-color:#5a4690 #0b0813}
body{background:radial-gradient(1100px 560px at 15% -8%,#2d1b55 0%,transparent 62%),radial-gradient(900px 480px at 100% 0,#3b2a0e 0%,transparent 55%),#0b0813;background-attachment:fixed}
h1{background:linear-gradient(90deg,#f2cf74,#e0b04a 45%,#b99cff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
h1,h2,summary,.capt,.xh{letter-spacing:.02em}
h2{color:#f2cf74}
.panel{background:linear-gradient(180deg,#1a1230,#120d20);border:1px solid #3a2b5c;box-shadow:0 10px 28px #000a}
button{font-family:Rajdhani,system-ui,sans-serif;letter-spacing:.02em;font-weight:700;background:linear-gradient(180deg,#2b2050,#1a1230);border:1px solid #5a4690;border-radius:8px;color:#efe9fb;padding:.5rem .95rem;transition:all .15s}
button:hover{border-color:#e0b04a;box-shadow:0 0 14px #e0b04a55;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.pri{background:linear-gradient(180deg,#f5d98a,#c9962f);color:#1b1405;border-color:#f2cf74;box-shadow:0 2px 12px #e0b04a44}
button.pri:hover{box-shadow:0 0 18px #e0b04a99}
button.on{background:linear-gradient(180deg,#3d2c70,#2a1d4d);border-color:#e0b04a;color:#f2cf74;box-shadow:inset 0 -2px 0 #e0b04a}
select,input,textarea{background:#0b0813;border:1px solid #3a2b5c;border-radius:8px}
select:hover,input:hover,textarea:hover{border-color:#5a4690}
.slot{background:#100b1d;border-color:#3a2b5c;border-radius:10px}
.slot.f{background:linear-gradient(180deg,#2d2150,#1c1433);border-color:#6a52a8}
.slot.f:hover,.aslot.f:hover,.card:hover{border-color:#e0b04a;box-shadow:0 0 12px #e0b04a44}
.slot.sp,.sp3 .slot,.aslot.f{border-color:#e0b04a}
.bar{border-radius:6px;height:12px}.bar i{background:linear-gradient(90deg,#8b6cff,#e0b04a)}.bar.over i{background:#ff6b7a}
.card{background:linear-gradient(180deg,#221846,#170f2d);border-radius:10px}
.riv,.shards>div{border-radius:10px}
.pb.fm{background:linear-gradient(180deg,#f5d98a,#c9962f);color:#1b1405}
.abh{font:700 .8rem Rajdhani,sans-serif;letter-spacing:.05em;color:var(--mu);text-align:center;padding-left:1.4rem}
.abrow{display:flex;align-items:center;gap:.3rem}.abn{font:700 .95rem Rajdhani,sans-serif;color:var(--gold);width:1.1rem;text-align:right}.abrow .ab{flex:1}
#abil{width:116px}.ro #abil{align-self:center}
#linkpop{position:absolute;bottom:calc(100% + 4px);left:0;right:0;z-index:20;display:flex;flex-direction:column;gap:.2rem;background:#120d20;border:1px solid var(--gold);border-radius:10px;padding:.3rem;box-shadow:0 8px 24px #000c;max-height:220px;overflow:auto}
#linkpop[hidden]{display:none}#linkpop button{text-align:left;letter-spacing:0;font-family:inherit}
#prevb{margin-bottom:.6rem}
</style>
</head>
<body>
<header><h1>Build Rehberi</h1></header>
<div class="row" id="admtop" style="max-width:1300px;margin:auto;padding:.4rem 1rem"><button data-fwd="exp">builds.json İndir</button><button data-fwd="imp">JSON İçe Aktar</button><button data-fwd="adminoff">Yönetici Modundan Çık</button></div>
<div id="msg" style="max-width:1300px;margin:auto;padding-inline:1rem">Veri yükleniyor...</div>
<main>
  <section id="builder" class="panel">
    <button id="prevb" data-prevb="1" hidden>← Önceki Build'e Dön</button>
    <button id="back" data-back="1">← Kayıtlı Buildlere Dön</button>
    <h2>Build</h2>
    <div class="row topbar"><button data-fwd="save" class="pri">Kaydet</button><button data-fwd="new">Yeni Build</button><button data-fwd="reset">Tümünü Sıfırla</button><button data-fwd="autof">Oto Forma</button></div>
    <div class="row" id="cats"></div>
    <div class="row"><img id="timg" class="ti" alt="" hidden><select id="item" aria-label="Warframe veya Silah"></select></div>
    <div class="row" id="cfgrow"></div>
    <div id="partbox"></div>
    <div class="row" id="custrow"><button data-cdel="1">− Yuva</button><button data-cadd="1">+ Yuva</button></div>
    <div class="row" id="elrow" hidden><select id="elem" aria-label="Bonus Element"></select><label>Bonus % <input type="number" id="bonus" min="25" max="60" value="25"></label></div>
    <div class="row"><input type="text" id="name" placeholder="Build Adı"><label><input type="checkbox" id="reactor" checked> Reaktör/Katalizör (60)</label></div>
    <div class="capt"><span>Kapasite</span><span id="capn"></span></div>
    <div class="bar" id="bar"><i></i></div>
    <div class="bwrap"><div><div class="slots sp3" id="sp"></div>
    <div class="slots" id="slots"></div><div class="arcs" id="arcs"></div></div><div id="abil"></div></div>
    <div id="xs"></div>
    <div id="tgtrow"></div>
    <div id="shbox"><h2 style="margin-top:1rem">Archon Shards</h2><div class="shards" id="shards"></div></div>
    <div id="notebox"><h2 style="margin-top:1rem">Not</h2>
      <div id="notewrap" style="position:relative"><div id="linkpop" hidden></div><textarea id="note" rows="4" placeholder="Build notu. Başka build'e köprü için [[Build adı]] yaz."></textarea></div><div id="notev" class="notev"></div>
      <div class="row" id="imgctl" style="margin-top:.5rem"><input type="text" id="imgurl" placeholder="Görsel bağlantısı (https://... veya img/dosya.png)"><button id="addurl">Bağlantıyı Ekle</button><button id="addfile">Görsel Yükle</button><input type="file" id="imgfile" accept="image/*" multiple hidden></div>
      <div class="gal" id="gal"></div></div>
    <div id="rivbox"><h2 style="margin-top:1rem">Riven Önerileri</h2><div class="rivs" id="rivs"></div><button data-addriv="1" id="addriv">+ Riven Ekle</button></div>
    <details id="evbox" open><summary>Incarnon Evrimleri</summary><div id="evs"></div></details>
    <div class="row" style="margin-top:1rem"><button class="pri" id="save">Kaydet</button><button id="new">Yeni Build</button><button id="reset">Tümünü Sıfırla</button><button id="autof">Oto Forma</button></div>
  </section>

  <section id="browser" class="panel">
    <div class="row"><button data-tab="mods" class="on">Modlar</button><button data-tab="arcanes">Arcane'ler</button></div>
    <p class="muted" style="margin:0 0 .6rem">Modu veya arcane'i yuvaya sürükle (dokunmatikte basılı tut) ya da dokun. Yuvadan listeye sürüklersen kaldırılır.</p>
    <details id="cmbox"><summary style="font-size:1.05rem;margin-top:0">+ Custom Mod Oluştur</summary>
      <div class="row"><input type="text" id="cmname" placeholder="Mod Adı"><select id="cmkind"><option value="normal">Normal Yuva</option><option value="aura">Aura</option><option value="stance">Stance</option><option value="exilus">Exilus</option></select></div>
      <div class="row"><select id="cmpol"><option value="">Nötr</option><option>madurai</option><option>vazarin</option><option>naramon</option><option>zenurik</option><option>unairu</option><option>penjaga</option><option>umbra</option></select>
        <label>Drain <input type="number" id="cmdrain" min="0" max="30" value="4" style="width:4.5rem"></label><label>Maks Rank <input type="number" id="cmrank" min="0" max="30" value="10" style="width:4.5rem"></label></div>
      <div class="row"><input type="text" id="cmdesc" placeholder="Açıklama (isteğe bağlı)"><button class="pri" id="cmsave">Kaydet</button></div>
      <div id="cmlist"></div></details>
    <div class="row"><input type="search" id="q" placeholder="Ara..." aria-label="Ara"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="saved" class="panel">
    <h2>Kayıtlı Buildler</h2>
    <div class="row" id="bcats"></div>
    <div class="row"><input type="search" id="bq" placeholder="Build Ara" aria-label="Build Ara"><button id="bgo">Ara</button></div>
    <div class="row" id="admrow"><button id="exp">builds.json İndir (Yayınlamak İçin)</button><button id="imp">JSON İçe Aktar</button><button id="adminoff">Yönetici Modundan Çık</button><input type="file" id="file" accept=".json" hidden></div>
    <div id="bl"></div>
  </section>
</main>

<script>
const CDN='https://cdn.jsdelivr.net/gh/WFCD/warframe-items@master/data/json/';
const SRC=[f=>'https://raw.githubusercontent.com/WFCD/warframe-items/master/data/json/'+f+'.json',f=>CDN+f+'.json'];
const IMG='https://cdn.warframestat.us/img/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Warframe','Primary','Secondary','Melee','Archgun','Archmelee','Zaw','Kitgun','Companion','Companion Weapon','Necramech','K-Drive','Railjack','Custom'];
const XC={Companion:{n:10,re:/^Companion Mod/},'Companion Weapon':{n:8,re:/^(Primary|Secondary|Melee|Pistol|Rifle|Shotgun|Bow|Sniper|Companion|Posture) Mod/},Necramech:{n:12,re:/^Necramech Mod/},'K-Drive':{n:8,re:/^K-Drive Mod/},Railjack:{n:8,aura:true,re:/^(Plexus|Railjack) Mod/},Custom:{n:12,re:/./}};
const MODRE={Warframe:/^Warframe Mod/,Primary:/^(Primary|Shotgun|Rifle|Bow|Sniper) Mod/,Secondary:/^(Secondary|Pistol) Mod/,Melee:/^(Melee|Stance) Mod/,Archgun:/^Arch-Gun Mod/,Archmelee:/^Arch-Melee Mod/,Zaw:/^Melee Mod/};
const ARC={Warframe:/^Warframe Arcane/,Primary:/^(Primary|Shotgun|Bow) Arcane/,Secondary:/^Secondary Arcane/,Melee:/^Melee Arcane/,Zaw:/^Zaw Arcane/,Kitgun:/^Kitgun Arcane/};
const SL={Warframe:['Warframe','Warframe'],Primary:['Primary'],Secondary:['Secondary'],Melee:['Melee'],Archgun:['Primary','Secondary'],Archmelee:['Melee','Melee'],Necramech:['Warframe','Warframe'],Zaw:['Melee','Zaw']};
const POLS=['','madurai','vazarin','naramon','zenurik','unairu','penjaga','umbra','omni'];
const PSYM={'':'·',madurai:'V',vazarin:'D',naramon:'—',zenurik:'Z',unairu:'U',penjaga:'P',umbra:'Ω',omni:'✦'};
const polLabel=p=>({madurai:'Madurai',vazarin:'Vazarin',naramon:'Naramon',zenurik:'Zenurik',unairu:'Unairu',penjaga:'Penjaga',umbra:'Umbra',omni:'Omni','':'Nötr'}[p]||p);
const ZP={Strike:[],Grip:[],Link:[]},KP={Chamber:[],Grip:{Primary:[],Secondary:[]},Loader:[]};
const ELEMS=['Impact','Heat','Cold','Electricity','Toxin','Magnetic','Radiation'];
const M=new Map(),A=new Map(),IT=new Map(),AB=new Map();
const PO=['pols','apol','a2pol','expol','stpol'];
const CF=['aura','au2','ex','st','slots','arcs','elem','bonus','reactor','helm','evo','parts','cn'];
const RIVCAT=['Primary','Secondary','Melee','Zaw','Kitgun','Archgun','Archmelee'];
const RS={common:['Damage','Critical Chance','Critical Damage','Multishot','Status Chance','Status Duration','Heat','Cold','Electricity','Toxin','Impact','Puncture','Slash','Damage vs Grineer','Damage vs Corpus','Damage vs Infested'],
 ranged:['Fire Rate','Reload Speed','Magazine Capacity','Ammo Maximum','Zoom','Punch Through','Projectile Speed','Weapon Recoil'],

  if(e.target.matches('#gal img')){e.target.classList.toggle('big');return}
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(RO&&!d.load&&!d.share&&d.cfg===undefined&&d.tgt===undefined&&!d.back&&!d.prevb&&d.bc===undefined)return;
  if(d.cat){if(S.id&&d.cat!==S.cat){S=blank();msg('Yeni build olarak başladı, önceki kayıt korundu.')}if(d.cat!==S.cat)navStack.length=0;selectCat(d.cat);renderAll()}
  else if(d.tab){tab=d.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b===t));renderList()}
  else if(d.mod)addMod(d.mod);
  else if(d.arc)addArc(d.arc);
  else if(d.pol!==undefined){const k=pk(d.pol);setP(k,omniOn?'omni':POLS[(POLS.indexOf(getP(k))+1)%POLS.length]);renderBuilder()}
  else if(d.rm!==undefined){setS(pk(d.rm),null);renderBuilder()}
  else if(d.cadd){S.cn=Math.min(14,NG()+1);cleanMods();renderBuilder()}
  else if(d.cdel){S.cn=Math.max(1,NG()-1);cleanMods();renderBuilder()}
  else if(d.cmdel){CM=CM.filter(c=>c.id!==d.cmdel);if(!CMD.includes(d.cmdel))CMD.push(d.cmdel);saveCMD();saveCM();syncCM();renderAll();msg('Custom mod silindi.')}
  else if(d.lk!==undefined){const ta=$('#note'),pos=ta.selectionStart??ta.value.length,pre=ta.value.slice(0,pos),m=pre.match(/\[\[([^\]\n]*)$/);
    if(m){const ins='[['+d.lk+']]';S.note=pre.slice(0,m.index)+ins+ta.value.slice(pos);renderNote();const np=m.index+ins.length;ta.focus();ta.setSelectionRange(np,np)}$('#linkpop').hidden=true}
  else if(d.prevb){
    const id=navStack.pop(),b=saved.find(x=>x.id===id);
    if(b){loadBuild(b);openView();renderAll();scrollTo({top:0,behavior:'smooth'})}
    else{msg('Önceki build bulunamadı (paylaşım linkinden açılmış olabilir).');renderBuilder()}
  }
  else if(d.fwd){$('#'+d.fwd).click()}
  else if(d.bc!==undefined){bcat=d.bc;renderSaved()}
  else if(d.back){navStack.length=0;document.body.classList.remove('open');history.replaceState(null,'',location.pathname+location.search);scrollTo({top:0})}
  else if(d.tgt!==undefined){d.tgt?enterTgt(d.tgt):leaveTgt();fitArcs();renderAll()}
  else if(d.cfg!==undefined){if(S.tgt){tgtSave();tgtLoad(+d.cfg)}else loadCfg(+d.cfg);renderBuilder()}
  else if(d.cfgadd){if(S.tgt){tgtSave();const e=S.exs[S.tgt];e.cfgs.push({n:'Config '+(e.cfgs.length+1),d:JSON.parse(JSON.stringify(e.cfgs[e.ci].d))});tgtLoad(e.cfgs.length-1)}else{stash();const c=JSON.parse(JSON.stringify(S.cfgs[S.ci].d));S.cfgs.push({n:'Config '+(S.cfgs.length+1),d:c});loadCfg(S.cfgs.length-1)}renderBuilder()}
  else if(d.cfgdel){if(S.tgt){const e=S.exs[S.tgt];if(e.cfgs.length<2){msg('En az bir config kalmalı.');return}e.cfgs.splice(e.ci,1);tgtLoad(0)}else{if(S.cfgs.length<2){msg('En az bir config kalmalı.');return}S.cfgs.splice(S.ci,1);loadCfg(0,true)}renderBuilder()}
  else if(d.omni){omniOn=!omniOn;t.classList.toggle('on',omniOn);t.textContent='Omni Forma Modu: '+(omniOn?'Açık (Polarite Rozetine Dokun)':'Kapalı')}
  else if(d.ab!==undefined){abPick=+d.ab;renderAbil()}
  else if(d.addriv){S.riv.push({n:'',st:[]});renderNote()}
  else if(d.rmriv!==undefined){S.riv.splice(+d.rmriv,1);renderNote()}
  else if(d.rmst!==undefined){const [i,j]=d.rmst.split('.').map(Number);S.riv[i].st.splice(j,1);renderNote()}
  else if(d.rmimg!==undefined){S.imgs.splice(+d.rmimg,1);renderNote()}
  else if(d.rmarc!==undefined){S.arcs[+d.rmarc]=null;renderBuilder()}
  else if(d.load){const b=saved.find(x=>x.id===d.load);if(b){navStack.length=0;loadBuild(b);openView();renderAll();scrollTo({top:0,behavior:'smooth'})}}
  else if(d.del){saved=saved.filter(x=>x.id!==d.del);persist();renderSaved()}
  else if(d.share){const b=saved.find(x=>x.id===d.share);if(!b)return;const u=link(b);
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>msg('Bağlantı kopyalandı.')).catch(()=>prompt('Bağlantı:',u))}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sh!==undefined){S.shards[+t.dataset.sh]=t.value||null;renderShards();return}
  if(t.dataset.pol!==undefined){setP(pk(t.dataset.pol),t.value);renderBuilder();return}
  if(t.id==='exn'){S.exn=t.value.trim();renderTgt();return}
  if(t.dataset.part!==undefined){S.parts[t.dataset.part]=t.value;renderParts();return}
  if(t.id==='excat'){S.cat=t.value;S.cn=XC[S.cat]?.n||8;cleanMods();renderAll();return}
  if(t.id==='hsel'){if(t.value)S.helm[abPick]=t.value;else delete S.helm[abPick];abPick=null;renderAbil();return}
  if(t.id==='cfgname'){const e=S.tgt?S.exs[S.tgt]:null;(e?e.cfgs[e.ci]:S.cfgs[S.ci]).n=t.value.trim()||'Config';renderCfg();return}
  if(t.dataset.rivn!==undefined){S.riv[+t.dataset.rivn].n=t.value;return}
  if(t.dataset.rivadd!==undefined&&t.value){
    const [ty,k]=t.value.split('|'),r=S.riv[+t.dataset.rivadd],pos=r.st.filter(x=>x.s>0).length,neg=r.st.length-pos;
    if(r.st.some(x=>x.k===k))msg('Bu stat zaten ekli.');
    else if(ty==='n'&&neg>=1)msg('En fazla 1 negatif stat.');
    else if(ty!=='n'&&pos>=3)msg('En fazla 3 pozitif stat.');
    else{r.st.push({k,s:ty==='n'?-1:1,sp:ty==='s'});msg('')}
    renderNote();return}
  if(t.dataset.rank!==undefined){const k=pk(t.dataset.rank),s=getS(k),m=M.get(s.u);s.r=Math.max(0,Math.min(maxRank(m),+t.value||0));renderBuilder()}
});
$('#item').addEventListener('change',e=>{const nv=e.target.value;if(S.id){const c=S.cat;S=blank();S.cat=c;msg('Yeni build olarak başladı, önceki kayıt korundu.')}S.item=nv;applyPols();cleanMods();S.parts={};if(!special())S.elem='';fitArcs();renderAll()});
$('#elem').addEventListener('change',e=>{S.elem=e.target.value});
$('#bonus').addEventListener('change',e=>{S.bonus=Math.max(25,Math.min(60,+e.target.value||25));e.target.value=S.bonus});
$('#name').addEventListener('input',e=>S.name=e.target.value);
$('#reactor').addEventListener('change',e=>{S.reactor=e.target.checked;renderBuilder()});
$('#q').addEventListener('input',renderList);
$('#save').addEventListener('click',()=>{
  const b=cur();S.id=b.id;if(!b.name)b.name=S.name=(b.item==='custom'&&b.cname?b.cname:IT.get(b.item)?.name||'Build');
  const i=saved.findIndex(x=>x.id===b.id);i<0?saved.unshift(b):saved[i]=b;persist();renderAll();msg('Build kaydedildi.')
});
$('#autof').addEventListener('click',()=>{autoForma();renderBuilder()});
$('#reset').addEventListener('click',()=>{if(!confirm('Bu build\'deki tüm seçimler, configler, not ve görseller sıfırlanacak. Devam?'))return;S=blank();selectCat('Warframe');navStack.length=0;history.replaceState(null,'',location.pathname+location.search);renderAll();msg('Build sıfırlandı. Kaydetmediysen kayıtlı hali değişmedi.')});
$('#new').addEventListener('click',()=>{const c=S.cat;S=blank();selectCat(c);navStack.length=0;history.replaceState(null,'',location.pathname+location.search);renderAll();msg('')});
$('#exp').addEventListener('click',()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({builds:saved,cmods:CM},null,2)],{type:'application/json'}));a.download='builds.json';a.click()
});
$('#imp').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',async e=>{
  try{const j=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(j)?j:j.builds;if(!Array.isArray(arr))throw 0;if(Array.isArray(j.cmods)){j.cmods.forEach(c=>{if(!CM.some(x=>x.id===c.id))CM.push(c);CMD=CMD.filter(x=>x!==c.id)});saveCMD();saveCM();syncCM();renderCm()}
    arr.forEach(b=>{if(b&&b.id){const i=saved.findIndex(x=>x.id===b.id);i<0?saved.push(b):saved[i]=b}});persist();renderSaved();msg('İçe aktarıldı.')}
  catch(err){msg('Dosya geçerli bir build listesi değil.')}
  e.target.value='';
});
function shrink(f){return new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};im.onerror=bad;im.src=r.result};r.onerror=bad;r.readAsDataURL(f)})}
$('#note').addEventListener('input',e=>{if(!RO){S.note=e.target.value;linkSuggest(e.target)}});
document.addEventListener('click',e=>{if(!e.target.closest('#linkpop,#note'))$('#linkpop').hidden=true});
$('#addurl').addEventListener('click',()=>{const v=$('#imgurl').value.trim();if(!v)return;S.imgs.push(v);$('#imgurl').value='';renderNote()});
$('#addfile').addEventListener('click',()=>$('#imgfile').click());
$('#imgfile').addEventListener('change',async e=>{for(const f of e.target.files){try{S.imgs.push(await shrink(f))}catch(err){msg('Görsel okunamadı: '+f.name)}}e.target.value='';renderNote()});
$('#bq').addEventListener('input',renderSaved);$('#bgo').addEventListener('click',renderSaved);
$('#adminoff').addEventListener('click',()=>{try{localStorage.removeItem('admin')}catch(e){}location.href=location.pathname});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.evo!==undefined&&!RO)S.evo[+d.evo]=e.target.value});
$('#cmsave').addEventListener('click',()=>{
  const n=$('#cmname').value.trim();if(!n){msg('Mod adı gerekli.');return}
  CM.unshift({id:'c'+Date.now().toString(36),name:n,ck:$('#cmkind').value,polarity:$('#cmpol').value,drain:Math.min(30,Math.abs(+$('#cmdrain').value||0)),rank:Math.max(0,Math.min(30,+$('#cmrank').value||0)),desc:$('#cmdesc').value.trim()});
  saveCM();syncCM();$('#cmname').value='';$('#cmdesc').value='';renderAll();msg('Custom mod kaydedildi, listenin başında.');
});
init();
</script>
</body>
</html>
